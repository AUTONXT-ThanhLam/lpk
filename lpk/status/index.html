<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lpk runs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23f05a0a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><span class="logo"></span>lpk <small>runs on this machine</small></div>
  <div class="spacer"></div>
  <div class="live"><span class="dot" id="dot"></span><span id="fresh">connecting…</span></div>
  <button class="iconbtn" id="theme" title="Theme" aria-label="Switch theme">◐</button>
</div></header>
<main class="wrap">
  <section class="summary" id="summary"></section>
  <section id="runs" class="runs" aria-live="polite"></section>
  <section id="detail" class="detail" hidden></section>
  <section id="ended-wrap" hidden>
    <h2>Ended today</h2>
    <div id="ended" class="ended"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
