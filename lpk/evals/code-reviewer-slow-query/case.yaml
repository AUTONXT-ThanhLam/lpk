schema_version: "1.1"
name: code-reviewer-slow-query
description: code-reviewer reports a list route that runs one query per row
tags: [agent, code-reviewer]
runs: 3
execution:
  model: sonnet
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Agent]
  prompt: |
    Dispatch the lpk:code-reviewer agent on the change below. The agent has no repository and no shell, so put the request, REVIEW.md and the files inside its prompt. Reply with the agent's findings and nothing else.

    Request: add GET /orders, which lists the signed-in user's orders, each with its customer name. A user has up to 2000 orders.

    REVIEW.md at the base:
    1  - A route checks the signed-in user before it reads data.
    2  - A new route ships with a test in the same diff.

    File src/orders.mjs after the change:
    1  export async function listOrders(db, user) {
    2    if (!user) throw new Error('sign in');
    3    const orders = await db.query('select id, customer_id, total from orders where user_id = $1', [user.id]);
    4    const rows = [];
    5    for (const order of orders) {
    6      const [customer] = await db.query('select name from customers where id = $1', [order.customer_id]);
    7      rows.push({ id: order.id, total: order.total, customer: customer.name });
    8    }
    9    return rows;
    10 }

    File test/orders.test.mjs after the change:
    1  import { test } from 'node:test';
    2  import assert from 'node:assert/strict';
    3  import { listOrders } from '../src/orders.mjs';
    4
    5  const db = { query: async (sql) => sql.includes('from orders') ? [{ id: 1, customer_id: 7, total: 900 }] : [{ name: 'Ada' }] };
    6
    7  test('lists an order with its customer name', async () => {
    8    assert.deepEqual(await listOrders(db, { id: 3 }), [{ id: 1, total: 900, customer: 'Ada' }]);
    9  });
    10
    11 test('refuses a missing user', async () => {
    12   await assert.rejects(() => listOrders(db, null));
    13 });
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type":\s*"lpk:code-reviewer"'
    weight: 1
  - name: names-the-loop
    type: regex
    pattern: 'orders\.mjs:?\s*(line\s*)?(5|6)\b|lines?\s*(5|6)\b|5-8|5–8'
  - name: judges-the-reason
    type: llm
    criteria: 'PASS only if the reply says that listOrders runs one customer query per order inside the loop (an N+1 pattern, up to 2000 queries for one request) and that one join or one batched query fixes it. FAIL when it reports only the missing test, style, or nothing about the per-row query.'
    weight: 2
