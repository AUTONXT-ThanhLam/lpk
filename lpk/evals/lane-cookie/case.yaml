schema_version: "1.1"
name: lane-cookie
description: the lpk skill names the Full lane for this request
tags: [skill, lane]
runs: 3
execution:
  model: sonnet
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
  append_system_prompt: 'The owner is away. Do not edit, run or start anything. Name the lane the lpk skill assigns, as one line "LANE: Quick" or "LANE: Full", then stop.'
  prompt: '/lpk:lpk Change the session cookie lifetime from 1 hour to 8 hours in auth/session.mjs'
graders:
  - name: lane
    type: regex
    pattern: 'LANE:\s*Full\b'
