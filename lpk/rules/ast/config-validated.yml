id: config-validated.javascript
language: JavaScript
severity: warning
message: "every setting is checked at load and its default fits its consumer"
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: identifier
        regex: '^(Number|parseInt|parseFloat)$'
    - has:
        field: arguments
        has:
          nthChild: 1
          regex: '^process\.env\b'
---
id: config-validated.typescript
language: TypeScript
severity: warning
message: "every setting is checked at load and its default fits its consumer"
rule:
  any:
    - kind: call_expression
      all:
        - has:
            field: function
            kind: identifier
            regex: '^(Number|parseInt|parseFloat)$'
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: '^process\.env\b'
    - kind: as_expression
      regex: '^import\.meta\.env\.\w+\s+as\s+string$'
---
