---
id: config-validated.python
language: Python
severity: warning
message: "every setting is checked at load and its default fits its consumer"
rule:
  kind: call
  all:
    - has:
        field: function
        kind: identifier
        regex: '^(int|float)$'
    - has:
        field: arguments
        has:
          nthChild: 1
          regex: '^os\.(environ|getenv)\b'
