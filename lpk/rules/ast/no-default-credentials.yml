id: no-default-credentials.javascript
language: JavaScript
severity: warning
message: "no credential lives in source or ships as a default"
rule:
  any:
    - pattern: process.env.$N || $D
    - pattern: process.env.$N ?? $D
    - pattern: process.env[$N] || $D
    - pattern: process.env[$N] ?? $D
constraints:
  N:
    regex: '\w*(PASSWORD|_PW|SECRET|TOKEN|API_?KEY)\w*'
  D:
    kind: string
    regex: '^[\x22\x27][^\x22\x27]+[\x22\x27]$'
