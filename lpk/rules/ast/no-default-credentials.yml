id: no-default-credentials.python
language: Python
severity: warning
message: "no credential lives in source or ships as a default"
rule:
  any:
    - pattern: os.environ.get($N, $D)
    - pattern: os.getenv($N, $D)
    - pattern: os.environ.get($N) or $D
    - pattern: os.getenv($N) or $D
constraints:
  N:
    kind: string
    regex: '\w*(PASSWORD|_PW|SECRET|TOKEN|API_?KEY)\w*'
  D:
    kind: string
    regex: '^[rRbBuU]?[\x22\x27]+[^\x22\x27]+[\x22\x27]+$'
