id: no-comments.javascript
language: JavaScript
severity: warning
message: "a comment nobody maintains drifts from the code; say it in a name or a test"
rule:
  kind: comment
  not:
    regex: '(?is)^(?:#!|//export\s+\w+\s*$|/\*+\s*(?:globals?|exported)\s+[\w$]|/\*\*.*@(?:type|typedef|param|returns?|satisfies|template|callback)\s*\{|(?:/\*+!?|//+|#+)[\s*]*(?:(?:eslint|prettier|biome|tslint|stylelint|jshint|jscs|istanbul|c8|v8 ignore|noqa|nosec|type: ignore|pragma|pylint|pyright|mypy|ruff|flake8|isort|fmt: (?:off|on|skip)|yapf|autopep8|rubocop|shellcheck|nolint\w*|clang-format|iwyu pragma|fallthrough|lint:|noinspection|nopmd|checkstyle|spotless|resharper|safety:|spdx-license-identifier|copyright|licensed (?:to|under)|coding[:=]|frozen_string_literal|typed:|sorbet|cspell|deno-lint-ignore)(?:[-:\s,*/(]|$)|(?:@ts-|go:|\+build|-\*-|<auto-generated|<reference|<amd-|@license|@preserve|@__PURE__|#__PURE__|@vite-ignore|@vitest|@jest-|@flow|@refresh|@jsx|#region|#endregion|\$non-nls)))'
---
