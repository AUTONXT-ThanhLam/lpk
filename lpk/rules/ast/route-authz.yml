id: route-authz.javascript
language: JavaScript
severity: warning
message: "every route and tool checks who is calling"
rule:
  any:
    - kind: call_expression
      all:
        - has:
            field: function
            kind: member_expression
            has:
              field: property
              regex: '^get$'
        - has:
            field: arguments
            has:
              nthChild: 1
              any:
                - kind: string
                - kind: template_string
              regex: '^[\x60"'']/[^\x60"'']*(logout|signout|sign-out|revoke|delete|remove|disable)'
    - pattern: $X.update($B)
    - pattern: Object.assign($T, $C)
constraints:
  B:
    regex: '^((req|request)\.body|updated_data|payload)$'
  C:
    regex: '^(req|request)\.body$'
