id: route-authz.python
language: Python
severity: warning
message: "every route and tool checks who is calling"
rule:
  any:
    - kind: decorator
      regex: '^@(app|router)\.websocket\('
    - pattern: add_websocket_route($$$A)
    - pattern: $O.add_websocket_route($$$A)
    - kind: call
      all:
        - has:
            field: function
            kind: attribute
            has:
              field: attribute
              regex: '^get$'
        - has:
            field: arguments
            has:
              nthChild: 1
              kind: string
              regex: '^[rRbBuU]?[`"'']/[^`"'']*(logout|signout|sign-out|revoke|delete|remove|disable)'
    - pattern: $X.update($B)
constraints:
  B:
    regex: '^((req|request)\.body|updated_data|payload)$'
