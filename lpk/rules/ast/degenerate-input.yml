id: degenerate-input.javascript
language: JavaScript
severity: warning
message: "edge-shaped input has defined behaviour"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  pattern: $S.split($$$A)[$I]
constraints:
  I:
    regex: '^[1-9]'
---
