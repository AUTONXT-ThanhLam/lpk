id: degenerate-input.python
language: Python
severity: warning
message: "edge-shaped input has defined behaviour"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  any:
    - pattern: $S.split($$$A)[$I]
    - pattern: $D.get($K, $E).$M($$$B)
constraints:
  I:
    regex: '^[1-9]'
  E:
    regex: '^(\{\}|\[\])$'
  K:
    kind: string
  M:
    regex: '^(items|keys|values|get)$'
---
