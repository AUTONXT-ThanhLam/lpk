id: clean-checkout-runs.javascript
language: JavaScript
severity: warning
message: "a fresh clone runs with only the documented steps"
rule:
  kind: string
  regex: '^[\x22\x27](\./)?[\w-]+/[\w./-]+\.(json|db|sqlite|csv)[\x22\x27]$'
  inside:
    any:
      - kind: variable_declarator
      - kind: assignment_expression
      - kind: assignment_pattern
---
