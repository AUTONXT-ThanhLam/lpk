id: secret-egress.javascript
language: JavaScript
severity: warning
message: "secrets and personal data stay in"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  any:
    - kind: call_expression
      all:
        - has:
            field: function
            kind: member_expression
            has:
              field: object
              regex: '(^|\.)(console|logger|log|logging)$'
        - has:
            field: arguments
            has:
              stopBy: end
              any:
                - kind: identifier
                  regex: '^(?i:(?:[a-z0-9]+_)*(?:(?:passw(?:or)?d|secret|credential)s?|api_?key|authorization|token))$|^[a-z][A-Za-z0-9]*(?:(?:Password|Passwd|Secret|Credential)s?|ApiKey|Authorization|Token)$'
                - kind: shorthand_property_identifier
                  regex: '^(?i:(?:[a-z0-9]+_)*(?:(?:passw(?:or)?d|secret|credential)s?|api_?key|authorization|token))$|^[a-z][A-Za-z0-9]*(?:(?:Password|Passwd|Secret|Credential)s?|ApiKey|Authorization|Token)$'
                - kind: property_identifier
                  regex: '^(?i:(?:[a-z0-9]+_)*(?:(?:passw(?:or)?d|secret|credential)s?|api_?key|authorization|token))$|^[a-z][A-Za-z0-9]*(?:(?:Password|Passwd|Secret|Credential)s?|ApiKey|Authorization|Token)$'
                  inside:
                    kind: member_expression
    - kind: call_expression
      all:
        - has:
            field: function
            kind: member_expression
            has:
              field: property
              regex: '^json$'
        - has:
            field: arguments
            has:
              kind: object
              has:
                kind: pair
                all:
                  - has:
                      field: key
                      regex: '^error$'
                  - has:
                      field: value
                      kind: member_expression
                      all:
                        - has:
                            field: property
                            regex: '^message$'
                        - has:
                            field: object
                            kind: identifier
