id: timeouts-retries.javascript
language: JavaScript
severity: warning
message: "outbound calls end, and retries are capped"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  all:
    - any:
        - pattern: fetch($$$A)
        - pattern: axios($$$A)
        - pattern: got($$$A)
        - pattern: axios.$M($$$A)
    - not:
        has:
          stopBy: end
          any:
            - regex: '^(timeout|signal)$'
            - kind: spread_element
constraints:
  M:
    regex: '^(get|post|put|patch|delete|request)$'
---
