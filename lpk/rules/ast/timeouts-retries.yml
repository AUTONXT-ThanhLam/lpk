id: timeouts-retries.python
language: Python
severity: warning
message: "outbound calls end, and retries are capped"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  any:
    - all:
        - any:
            - pattern: requests.$F($$$A)
            - pattern: httpx.$F($$$A)
        - not:
            has:
              stopBy: end
              any:
                - kind: keyword_argument
                  has:
                    field: name
                    regex: '^timeout$'
                - kind: dictionary_splat
    - kind: keyword_argument
      all:
        - has:
            field: name
            regex: '^timeout$'
        - has:
            field: value
            kind: none
    - kind: assignment
      all:
        - has:
            field: left
            regex: '^timeout$'
        - has:
            field: right
            kind: none
constraints:
  F:
    regex: '^(get|post|put|patch|delete|request)$'
---
