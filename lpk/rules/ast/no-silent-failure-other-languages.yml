id: no-silent-failure.python
language: Python
severity: warning
message: "a failure never reads as success"
rule:
  any:
    - kind: except_clause
      has:
        kind: block
        all:
          - has:
              any:
                - kind: pass_statement
                - kind: expression_statement
                  regex: '^\.\.\.$'
          - not:
              has:
                not:
                  any:
                    - kind: pass_statement
                    - kind: comment
                    - kind: expression_statement
                      regex: '^\.\.\.$'
    - kind: assignment
      all:
        - has:
            field: left
            regex: '^_$'
        - has:
            field: right
            kind: call
    - pattern: $F($$$A)
      inside:
        kind: expression_statement
        stopBy: neighbor
      has:
        field: function
        regex: '(^|\.)(create_task|ensure_future)$'
---
id: no-silent-failure.java
language: Java
severity: warning
message: "a failure never reads as success"
rule:
  kind: catch_clause
  has:
    field: body
    matches: empty-block
utils:
  empty-block:
    kind: block
    not:
      has:
        not:
          any:
            - regex: '^[{}]$'
            - regex: '^(//|/\*|#)'
---
