id: partial-results.javascript
valid:
  - |-
      for (const f of files) {
        try { read(f) } catch (e) { skipped.push(f); continue }
      }
  - |-
      for (const f of files) {
        try { read(f) } catch (e) { log.warn(e) }
      }
invalid:
  - |-
      for (const f of files) {
        try { read(f) } catch (e) { continue }
      }
  - |-
      for (const f of files) {
        try { read(f) } catch { continue; }
      }
  - |-
      for (const f of files) {
        try { read(f) } catch (e) {
          // unreadable
          continue
        }
      }
---
