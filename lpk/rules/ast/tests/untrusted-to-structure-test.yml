id: untrusted-to-structure.go
valid:
  - |-
      package main
      func f() {
      	cmd := exec.Command("git", "log", ref)
      }
  - |-
      package main
      func f() {
      	rows, _ := db.Query("SELECT * FROM users WHERE id = $1", id)
      }
invalid:
  - |-
      package main
      func f() {
      	cmd := exec.Command("sh", "-c", "ls "+dir)
      }
  - |-
      package main
      func f() {
      	q := "SELECT * FROM users WHERE id = " + id
      }
