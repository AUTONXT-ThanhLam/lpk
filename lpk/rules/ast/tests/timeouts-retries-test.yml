id: timeouts-retries.python
valid:
  - "r = requests.get(url, timeout=5)"
  - "r = httpx.post(url, json=body, timeout=httpx.Timeout(5.0))"
  - "r = requests.get(url, **kwargs)"
  - "r = session.get(url)"
  - "s = \"requests.get(url)\""
invalid:
  - "r = requests.get(url)"
  - "r = httpx.post(url, json=body)"
  - "r = requests.request(\"GET\", url, headers=h)"
  - "r = requests.get(url, timeout=None)"
  - "timeout = None"
