id: timeouts-retries.javascript
valid:
  - "const r = await fetch(url, { signal: AbortSignal.timeout(5000) })"
  - "const r = await fetch(url, { method: \"POST\", body, signal: ctrl.signal })"
  - "const r = await fetch(url, { signal })"
  - "const r = await axios.get(url, { timeout: 5000 })"
  - "const r = await got(url, { timeout: { request: 5000 } })"
  - "const r = await fetch(url, { ...defaults })"
  - "const r = await client.get(url)"
  - "const s = \"fetch(url)\""
invalid:
  - "const r = await fetch(url)"
  - "const r = await fetch(url, { method: \"POST\", body: JSON.stringify(b) })"
  - "const r = await axios.post(url, data)"
  - "const r = await axios({ url, method: \"get\" })"
  - "const r = await got(url)"
