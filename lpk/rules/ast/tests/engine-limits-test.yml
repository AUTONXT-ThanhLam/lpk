id: engine-limits.javascript
valid:
  - "const m = Math.max(a, b)"
  - "const m = Math.max.apply(null, bounded)"
  - "const all = [...a, ...b]"
  - "out.push(item)"
  - "const ok = Number.isSafeInteger(n)"
  - "const s = \"Math.max(...a)\""
  - "setTimeout(stop, 5000)"
  - "setTimeout(stop, Math.min(ms, 2147483647))"
  - "setTimeout(stop)"
invalid:
  - "const m = Math.max(...scores)"
  - "const lo = Math.min(first, ...rest)"
  - "out.push(...chunk)"
  - "const s = String.fromCharCode(...bytes)"
  - "const ok = Number.isInteger(n)"
  - "const t = setTimeout(stop, seconds * 1000)"
  - "setInterval(pass, envMs(\"EVERY\", 300000))"
