---
id: fail-closed.php
valid:
  - "<?php try { verify($t); } catch (Exception $e) { return false; }"
  - "<?php $key = getenv(\"APP_KEY\");"
  - "<?php $env = getenv(\"APP_ENV\") ?: \"dev\";"
invalid:
  - "<?php try { verify($t); } catch (Exception $e) { return true; }"
  - "<?php $key = getenv(\"APP_KEY\") ?: \"base64:dev\";"
  - "<?php $pw = getenv(\"DB_PASSWORD\") ?? \"root\";"
---
id: fail-closed.kotlin
valid:
  - "fun f(): Boolean { try { verify() } catch (e: Exception) { return false }; return true }"
invalid:
  - "fun f(): Boolean { try { verify() } catch (e: Exception) { return true }; return false }"
