id: fail-closed.javascript
valid:
  - "try { await verify(token) } catch (e) { return false }"
  - "try { await verify(token) } catch (e) { next(e) }"
  - "try { await verify(token) } catch (e) { throw new Error(\"denied\") }"
  - "function isAdmin(u) { return true }"
  - "const msg = \"catch { return true }\""
  - "const env = process.env.NODE_ENV || \"development\""
  - |-
      const key = process.env.API_KEY
      if (!key) throw new Error("API_KEY is not set")
  - "const key = process.env[\"SESSION_SECRET\"]"
invalid:
  - "try { await verify(token) } catch (e) { return true }"
  - |-
      function guard(req, res, next) {
        try {
          check(req)
        } catch {
          return next()
        }
      }
  - |-
      function guard(req, res, next) {
        try {
          check(req)
        } catch (err) {
          console.error(err)
          next()
        }
      }
  - "const secret = process.env.JWT_SECRET || \"dev-secret\""
  - "const token = process.env.API_TOKEN ?? \"\""
  - "const pw = process.env[\"DB_PASSWORD\"] || \"postgres\""
