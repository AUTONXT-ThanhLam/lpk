id: fail-closed.python
valid:
  - |-
      try:
          verify(token)
      except InvalidToken:
          return False
  - |-
      try:
          verify(token)
      except InvalidToken:
          raise PermissionError("denied")
  - "debug = os.environ.get(\"DEBUG\", \"0\")"
  - "key = os.environ[\"SECRET_KEY\"]"
  - |-
      key = os.environ.get("SECRET_KEY")
      if key is None:
          raise RuntimeError("SECRET_KEY is not set")
  - "x = \"except: return True\""
invalid:
  - |-
      try:
          verify(token)
      except Exception:
          return True
  - |-
      try:
          verify(token)
      except:
          log.warning("verify failed")
          return True
  - "secret = os.environ.get(\"JWT_SECRET\", \"dev-secret\")"
  - "token = os.getenv(\"API_TOKEN\", \"\")"
  - "password = os.getenv(\"DB_PASSWORD\") or \"postgres\""
  - "key = os.environ[\"SECRET_KEY\"] or \"x\""
---
id: fail-closed.java
valid:
  - "class A { Object f() { try { verify(); } catch (Exception e) { return false; } return true; } }"
  - "class A { Object f() { try { verify(); } catch (Exception e) { throw new SecurityException(); } return true; } }"
invalid:
  - "class A { Object f() { try { verify(); } catch (Exception e) { return true; } return false; } }"
