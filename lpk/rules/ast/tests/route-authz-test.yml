id: route-authz.javascript
valid:
  - "app.get('/users', listUsers)"
  - "app.post('/logout', requireAuth, logout)"
  - "params.get('delete')"
  - "app.delete('/sessions/:id', requireAuth, revoke)"
  - "user.update(pick(req.body, [\"name\"]))"
  - "Object.assign(target, defaults)"
  - "const s = \"app.get('/logout')\""
invalid:
  - "app.get('/logout', (req, res) => { req.session.destroy(); res.sendStatus(204) })"
  - "router.get(`/sessions/revoke/${id}`, handler)"
  - "await user.update(req.body)"
  - "Object.assign(user, req.body)"
  - "row.update(payload)"
