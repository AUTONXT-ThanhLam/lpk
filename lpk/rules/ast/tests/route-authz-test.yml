id: route-authz.python
valid:
  - |-
      @app.get("/users")
      async def users(): ...
  - |-
      @app.post("/logout")
      async def logout(user=Depends(current_user)): ...
  - "cfg.update(defaults)"
  - "x = d.get(\"delete\")"
