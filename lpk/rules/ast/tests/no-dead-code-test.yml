id: no-dead-code.javascript
valid:
  - |-
      // Return the cached value when it is fresh
      const a = 1
  - |-
      // const is a keyword
      const a = 1
  - "const s = \"// const a = 1\""
invalid:
  - |-
      // const legacy = loadLegacy()
      const a = 1
  - |-
      // await refresh(token)
      const a = 1
  - |-
      // return compute(x)
      const a = 1
  - |-
      // import { x } from './x'
      const a = 1
