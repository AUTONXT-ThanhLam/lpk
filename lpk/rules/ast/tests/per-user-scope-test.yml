id: per-user-scope.javascript
valid:
  - |-
      function make() {
        const cache = new Map()
        return cache
      }
  - "const REGISTRY = new Map()"
  - "const byUser = new Map([[1, 2]])"
  - "const s = \"const cache = new Map()\""
invalid:
  - "const sessions = new Map()"
  - "export const lastSeen = new Map()"
  - "let cache = new Map()"
