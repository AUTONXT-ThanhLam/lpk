id: secret-egress.python
valid:
  - "print(\"token refreshed\")"
  - "logger.info(\"password reset email sent for %s\", user_id)"
  - "logging.info(\"tokens used: %d\", n_tokens)"
  - "raise HTTPException(status_code=500, detail=\"internal error\")"
invalid:
  - "print(f\"login {password}\")"
  - "logger.debug(\"auth header %s\", request.headers.authorization)"
  - "logging.info(\"refresh %s\", refresh_token)"
  - "log.warning(\"key=%s\", settings.api_key)"
  - "raise HTTPException(status_code=500, detail=str(e))"
---
id: secret-egress.go
valid:
  - |-
      package main
      func f() {
      	log.Printf("token refreshed")
      }
invalid:
  - |-
      package main
      func f() {
      	log.Printf("auth %s", cfg.Token)
      }
  - |-
      package main
      func f() {
      	logger.Info(password)
      }
---
id: secret-egress.java
valid:
  - "class A { void f() { log.info(\"token refreshed\"); } }"
invalid:
  - "class A { void f() { log.info(\"auth \" + password); } }"
  - "class A { void f() { logger.debug(user.getApiKey(), apiKey); } }"
