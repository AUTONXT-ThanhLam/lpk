id: secret-egress.javascript
valid:
  - "console.log(\"token refreshed\")"
  - "logger.info(\"password reset email sent\", { userId })"
  - "console.log(\"tokens used\", tokens)"
  - "console.log({ token: \"[redacted]\" })"
  - "logger.info(`maxTokens=${maxTokens}`)"
  - "res.status(500).json({ error: \"internal error\" })"
  - "const token = jwt.sign(payload, key)"
invalid:
  - "console.log(\"login\", user.password)"
  - "logger.debug({ apiKey })"
  - "console.error(`bad token ${token}`)"
  - "log.info(\"auth\", req.headers.authorization)"
  - "console.log(process.env.API_TOKEN)"
  - "this.logger.warn(\"refresh failed\", { refreshToken })"
  - "res.status(500).json({ error: err.message })"
