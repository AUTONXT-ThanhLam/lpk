id: no-comments.javascript
valid:
  - |-
      // eslint-disable-next-line no-console
      const a = 1
  - |-
      /* global window */
      const a = 1
  - |-
      const s = "// not a comment"
invalid:
  - |-
      // set the flag
      const a = 1
  - |-
      /* old
       value */
      const a = 1
  - |-
      // refresh the token before it expires
      const a = 1
  - |-
      // global counter shared by all workers
      const a = 1
  - |-
      // license check happens upstream
      const a = 1
  - |-
      // region codes are two letters
      const a = 1
---
id: no-comments.typescript
valid:
  - |-
      // @ts-expect-error
      const a = 1
  - |-
      /// <reference path="x.d.ts" />
      const a = 1
  - |-
      const s = "// not a comment"
invalid:
  - |-
      // set the flag
      const a = 1
  - |-
      /* old
       value */
      const a = 1
---
id: no-comments.tsx
valid:
  - |-
      // @ts-expect-error
      const a = 1
  - |-
      // eslint-disable-next-line no-console
      const a = 1
  - |-
      const s = "// not a comment"
