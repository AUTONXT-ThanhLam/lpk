id: no-comments.python
valid:
  - |-
      # noqa: E501
      a = 1
  - |-
      # type: ignore
      a = 1
  - |-
      #!/usr/bin/env python3
      a = 1
  - |-
      s = "# not a comment"
invalid:
  - |-
      # set the flag
      a = 1
---
id: no-comments.go
valid:
  - |-
      //go:build linux
      var a = 1
  - |-
      //nolint:errcheck
      var a = 1
  - |-
      var s = "// not a comment"
invalid:
  - |-
      // set the flag
      var a = 1
  - |-
      /* old
       value */
      var a = 1
---
id: no-comments.rust
valid:
  - |-
      // SAFETY: the pointer is valid
      const A: i32 = 1;
  - |-
      // Copyright 2024 Acme
      const A: i32 = 1;
  - |-
      const S: &str = "// not a comment";
invalid:
  - |-
      // set the flag
      const A: i32 = 1;
  - |-
      /* old
       value */
      const A: i32 = 1;
---
id: no-comments.java
valid:
  - |-
      // NOPMD
      class A { int a = 1; }
  - |-
      /* Copyright 2024 Acme */
      class A { int a = 1; }
  - |-
      class A { String s = "// not a comment"; }
invalid:
  - |-
      // set the flag
      class A { int a = 1; }
  - |-
      /* old
       value */
      class A { int a = 1; }
---
id: no-comments.ruby
valid:
  - |-
      # frozen_string_literal: true
      a = 1
  - |-
      # rubocop:disable Metrics/AbcSize
      a = 1
  - |-
      #!/usr/bin/env ruby
      a = 1
  - |-
      s = "# not a comment"
invalid:
  - |-
      # set the flag
      a = 1
---
id: no-comments.bash
valid:
  - |-
      # shellcheck disable=SC2086
      a=1
  - |-
      # SPDX-License-Identifier: MIT
      a=1
  - |-
      #!/usr/bin/env bash
      a=1
  - |-
      s="# not a comment"
invalid:
  - |-
      # set the flag
      a=1
---
id: no-comments.c
valid:
  - |-
      // NOLINT(readability-magic)
      int a = 1;
  - |-
      /* Copyright 2024 Acme */
      int a = 1;
  - |-
      const char *s = "// not a comment";
invalid:
  - |-
      // set the flag
      int a = 1;
  - |-
      /* old
       value */
      int a = 1;
