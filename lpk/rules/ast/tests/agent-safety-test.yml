id: agent-safety.javascript
valid:
  - "eval(\"1 + 1\")"
  - "child.exec(cmd)"
  - "const v = JSON.parse(text)"
  - "const f = Function.prototype.bind"
invalid:
  - "const out = eval(code)"
  - "execSync(cmd, { stdio: \"inherit\" })"
  - "exec(`ls ${dir}`)"
  - "const f = new Function(\"a\", \"b\", body)"
