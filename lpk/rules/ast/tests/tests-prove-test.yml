id: tests-prove.javascript
valid:
  - "it(\"adds\", () => { expect(add(1, 2)).toBe(3) })"
  - "describe(\"math\", () => { test(\"adds\", () => {}) })"
  - "const s = \"it.only(x)\""
  - "queue.skip(job)"
invalid:
  - "it.only(\"adds\", () => { expect(add(1, 2)).toBe(3) })"
  - "describe.skip(\"math\", () => {})"
  - "test.skip(\"adds\", () => {})"
  - "xit(\"adds\", () => {})"
  - "fdescribe(\"math\", () => {})"
