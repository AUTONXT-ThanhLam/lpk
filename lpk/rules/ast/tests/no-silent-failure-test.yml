id: no-silent-failure.php
valid:
  - "<?php try { save(); } catch (Exception $e) { error_log($e->getMessage()); throw $e; }"
invalid:
  - "<?php try { save(); } catch (Exception $e) { }"
  - "<?php try { save(); } catch (Exception $e) { /* ignored */ }"
---
id: no-silent-failure.kotlin
valid:
  - "fun f() { try { save() } catch (e: Exception) { log.error(\"save failed\", e); throw e } }"
invalid:
  - "fun f() { try { save() } catch (e: Exception) { } }"
  - "fun f() { try { save() } catch (e: Exception) { /* ignored */ } }"
---
id: no-silent-failure.swift
valid:
  - "func f() { do { try save(x) } catch { log(error); throw error } }"
  - "func f() { let v = try? parse(s) ?? 0 }"
  - "func f() { try save(x) }"
invalid:
  - "func f() { let _ = save(x) }"
  - "func f() { do { try save(x) } catch { } }"
  - "func f() { try? save(x) }"
  - "func f() { _ = try? save(x) }"
---
id: no-silent-failure.go
valid:
  - |-
      package main
      func f() {
      	if err := save(x); err != nil {
      		return err
      	}
      }
  - |-
      package main
      func f() {
      	n, _ := strconv.Atoi(s)
      }
  - |-
      package main
      func f() {
      	_ = x
      }
invalid:
  - |-
      package main
      func f() {
      	_ = save(x)
      }
  - |-
      package main
      func f() {
      	_, _ = fmt.Fprintf(w, "ok")
      }
---
id: no-silent-failure.rust
valid:
  - "fn f() { let _guard = lock(); let v = save(x)?; }"
  - "fn f() { let r = tx.send(1).ok(); }"
  - "fn f() { if let Err(e) = save(x) { log::error!(\"{e}\"); } }"
invalid:
  - "fn f() { let _ = tx.send(1); }"
  - "fn f() { let _ = save(x).await; }"
  - "fn f() { save(x).ok(); }"
---
id: no-silent-failure.bash
valid:
  - "if [ -f \"$f\" ]; then rm \"$f\"; else echo missing; fi"
  - "[ -f \"$f\" ] && rm \"$f\""
  - "cmd1 && cmd2 || cmd3"
invalid:
  - "[ -f \"$f\" ] && echo found || echo missing"
  - "[[ -n \"$TOKEN\" ]] && deploy || exit 1"
---
id: no-silent-failure.ruby
valid:
  - "value = Integer(s) rescue 0"
  - "value = Integer(s)"
invalid:
  - "value = Integer(s) rescue nil"
  - "cleanup rescue nil"
