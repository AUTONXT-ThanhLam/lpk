id: no-silent-failure.python
valid:
  - |-
      try:
          risky()
      except ValueError as e:
          log.error("risky failed: %s", e)
          raise
  - |-
      try:
          risky()
      except ValueError:
          return default
  - |-
      try:
          risky()
      except ValueError:
          pass
          log.warning("ignored")
  - "result = compute()"
  - |-
      for _ in range(3):
          attempt()
  - |-
      task = asyncio.create_task(job())
      await task
  - "s = \"except Exception: pass\""
invalid:
  - |-
      try:
          risky()
      except Exception:
          pass
  - |-
      try:
          risky()
      except (OSError, ValueError):
          ...
  - |-
      try:
          risky()
      except:
          # nothing to do
          pass
  - "_ = send_email(user)"
  - "asyncio.create_task(refresh_cache())"
  - "loop.create_task(refresh_cache())"
---
id: no-silent-failure.java
valid:
  - "class A { void f() { try { save(); } catch (Exception e) { log.error(\"save failed\", e); throw e; } } }"
  - "class A { void f() { String s = \"catch (Exception e) { }\"; } }"
invalid:
  - "class A { void f() { try { save(); } catch (Exception e) { } } }"
  - |-
      class A { void f() { try { save(); } catch (Exception e) {
       // ignored
       } } }
---
