id: no-silent-failure.javascript
valid:
  - "try { await save(x) } catch (e) { log.error(e); throw e }"
  - "try { await save(x) } catch (e) { return fallback(e) }"
  - "save(x).catch((e) => { log.error(\"save failed\", e) })"
  - "save(x).catch(handle)"
  - |-
      const rows = []
      const o = {}
  - "const f = () => {}"
  - "const msg = \"catch (e) { }\""
  - |-
      // try { a() } catch (e) {}
      run()
  - "const [a, b] = await Promise.all([x(), y()])"
  - |-
      async function run(jobs) {
        const results = await Promise.allSettled(jobs)
        for (const r of results) if (r.status === "rejected") log.error(r.reason)
      }
invalid:
  - "try { await save(x) } catch (e) { }"
  - "try { await save(x) } catch { /* ignore */ }"
  - |-
      try {
        await save(x)
      } catch (e) {
        // best effort
      }
  - "save(x).catch(() => {})"
  - "save(x).catch((e) => undefined)"
  - "const v = await load(x).catch(() => null)"
  - "const v = await load(x).catch(e => false)"
  - "const v = await load(x).catch(() => [])"
  - "const v = await load(x).catch(() => ({}))"
  - "const v = await load(x).catch(() => void 0)"
  - "void sendEmail(user)"
  - "void db.audit.insert(row)"
  - "const results = await Promise.allSettled(jobs)"
  - |-
      async function run(jobs) {
        const results = await Promise.allSettled(jobs)
        return results.filter((r) => r.status === "fulfilled").map((r) => r.value)
      }
---
