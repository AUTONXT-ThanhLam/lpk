id: no-default-credentials.javascript
valid:
  - "const pw = process.env.DB_PASSWORD"
  - "const pw = process.env.DB_PASSWORD || \"\""
  - "const host = process.env.DB_HOST || \"localhost\""
  - "const pw = process.env.DB_PASSWORD ?? fail(\"DB_PASSWORD is required\")"
invalid:
  - "const pw = process.env.DB_PASSWORD || \"postgres\""
  - "const key = process.env.API_KEY ?? \"dev-key\""
  - "const t = process.env[\"AUTH_TOKEN\"] || 'changeme'"
