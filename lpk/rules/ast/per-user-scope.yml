id: per-user-scope.python
language: Python
severity: warning
message: "per-user data is keyed per user"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  kind: expression_statement
  inside:
    kind: module
  has:
    kind: assignment
    all:
      - has:
          field: left
          kind: identifier
          regex: '^[a-z_]\w*$'
      - has:
          field: right
          any:
            - kind: dictionary
              regex: '^\{\s*\}$'
            - pattern: dict()
