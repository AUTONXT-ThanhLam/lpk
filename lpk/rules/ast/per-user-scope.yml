id: per-user-scope.javascript
language: JavaScript
severity: warning
message: "per-user data is keyed per user"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  all:
    - any:
        - kind: lexical_declaration
        - kind: variable_declaration
    - any:
        - inside:
            kind: program
        - inside:
            kind: export_statement
            inside:
              kind: program
    - has:
        kind: variable_declarator
        all:
          - has:
              field: name
              regex: '^[a-z]'
          - has:
              field: value
              kind: new_expression
              regex: '^new Map(<[^(]*>)?\(\s*\)$'
