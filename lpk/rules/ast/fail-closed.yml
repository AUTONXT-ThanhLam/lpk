id: fail-closed.javascript
language: JavaScript
severity: warning
message: "a missing or failing check refuses"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  any:
    - kind: catch_clause
      has:
        stopBy: end
        any:
          - kind: return_statement
            has:
              kind: 'true'
          - pattern: next()
    - pattern: process.env.$N || $D
    - pattern: process.env.$N ?? $D
    - pattern: process.env[$N] || $D
    - pattern: process.env[$N] ?? $D
constraints:
  N:
    regex: 'SECRET|TOKEN|KEY|PASSWORD|AUTH'
