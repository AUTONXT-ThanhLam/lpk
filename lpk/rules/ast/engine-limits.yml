id: engine-limits.javascript
language: JavaScript
severity: warning
message: "numbers and arrays stay inside the runtime's limits"
rule:
  any:
    - kind: call_expression
      all:
        - has:
            field: function
            kind: member_expression
            regex: '^(Math\.(max|min)|String\.fromCharCode)$|\.push$'
        - has:
            field: arguments
            has:
              kind: spread_element
    - pattern: Number.isInteger($$$A)
    - kind: call_expression
      all:
        - has:
            field: function
            regex: '^(setTimeout|setInterval)$'
        - has:
            field: arguments
            has:
              nthChild: 2
              not:
                any:
                  - kind: number
                  - kind: call_expression
                    regex: '^Math\.min\('
