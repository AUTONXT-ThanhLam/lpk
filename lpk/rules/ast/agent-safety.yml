id: agent-safety.python
language: Python
severity: warning
message: "model and tool output is data, loops stop"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  kind: call
  all:
    - has:
        field: function
        kind: identifier
        regex: '^(eval|exec)$'
    - has:
        field: arguments
        has:
          nthChild: 1
          not:
            kind: string
            not:
              has:
                kind: interpolation
