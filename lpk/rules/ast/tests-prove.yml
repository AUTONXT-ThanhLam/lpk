id: tests-prove.javascript
language: JavaScript
severity: warning
message: "tests fail when the change is undone"
rule:
  any:
    - pattern: $T.only($$$A)
    - pattern: $T.skip($$$A)
    - pattern: xit($$$A)
    - pattern: fit($$$A)
    - pattern: xdescribe($$$A)
    - pattern: fdescribe($$$A)
constraints:
  T:
    regex: '^(it|test|describe)$'
