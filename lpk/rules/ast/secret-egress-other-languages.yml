id: secret-egress.python
language: Python
severity: warning
message: "secrets and personal data stay in"
ignores:
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - "**/*-test.*"
  - "**/*_spec.*"
  - "**/*-spec.*"
rule:
  any:
    - kind: call
      all:
        - any:
            - has:
                field: function
                kind: identifier
                regex: '^print$'
            - has:
                field: function
                kind: attribute
                has:
                  field: object
                  regex: '(^|\.)(logger|log|logging)$'
        - has:
            field: arguments
            has:
              stopBy: end
              kind: identifier
              regex: '^(?i:(?:[a-z0-9]+_)*(?:(?:passw(?:or)?d|secret|credential)s?|api_?key|authorization|token))$|^[a-z][A-Za-z0-9]*(?:(?:Password|Passwd|Secret|Credential)s?|ApiKey|Authorization|Token)$'
    - kind: keyword_argument
      all:
        - has:
            field: name
            regex: '^detail$'
        - has:
            field: value
            kind: call
            all:
              - has:
                  field: function
                  regex: '^str$'
              - has:
                  field: arguments
                  has:
                    kind: identifier
                    regex: '^(e|ex|exc|err|error|exception)$'
---
