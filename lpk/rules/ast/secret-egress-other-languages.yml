              regex: '^(?i:(?:[a-z0-9]+_)*(?:(?:passw(?:or)?d|secret|credential)s?|api_?key|authorization|token))$|^[a-z][A-Za-z0-9]*(?:(?:Password|Passwd|Secret|Credential)s?|ApiKey|Authorization|Token)$'
