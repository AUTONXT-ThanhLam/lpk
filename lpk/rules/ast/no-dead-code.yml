id: no-dead-code.javascript
language: JavaScript
severity: warning
message: "nothing ships that does nothing"
rule:
  kind: comment
  regex: '^//\s*((const|let|var)\s+\w+\s*=|(await|return)\s+[\w.]+\(.*\)\s*;?\s*$|import\s.+\bfrom\s+[\x22\x27])'
---
